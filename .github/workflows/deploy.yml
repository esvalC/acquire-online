name: Deploy

on:
  # Every push to main → production (there is no beta site any more)
  push:
    branches: [main]
  # Manual redeploy from the Actions tab
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy-production:
    name: Deploy → Production
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::654654349405:role/acquire-online-github-actions-role
          aws-region: us-east-1

      - name: Deploy to production (acquire-main, port 3000)
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids i-0bbc6c13fd3dfe6ab \
            --document-name "AWS-RunShellScript" \
            --comment "Production deploy - ${{ github.sha }}" \
            --parameters 'commands=[
              "git -C /home/ubuntu/acquire-main -c safe.directory=/home/ubuntu/acquire-main pull origin main",
              "chown -R ubuntu:ubuntu /home/ubuntu/acquire-main",
              "sudo -u ubuntu npm --prefix /home/ubuntu/acquire-main install --omit=dev",
              "sudo -u ubuntu pm2 restart acquire-main",
              "echo PROD_DEPLOY_DONE"
            ]' \
            --query "Command.CommandId" --output text)

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id i-0bbc6c13fd3dfe6ab

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id i-0bbc6c13fd3dfe6ab \
            --query "StandardOutputContent" --output text

          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id i-0bbc6c13fd3dfe6ab \
            --query "Status" --output text)
          [ "$STATUS" = "Success" ] || exit 1

